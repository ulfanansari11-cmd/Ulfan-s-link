<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050608">
  <meta name="description" content="Ulfan — Creator | Shayari & Lifestyle. Find all my social profiles in one place.">
  <title>Ulfan | Social Links</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050608;
      --panel: rgba(15, 17, 23, .92);
      --text: #f5f7ff;
      --muted: #a5adbd;
      --cyan: #00f5ff;
      --pink: #ff2bd6;
      --line: rgba(0, 245, 255, .28);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 28px 16px;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse at 12% 18%, rgba(255, 43, 214, .14), transparent 36%),
        radial-gradient(ellipse at 88% 82%, rgba(0, 245, 255, .12), transparent 38%),
        var(--bg);
    }
    .card {
      width: min(100%, 440px); text-align: center; padding: 32px 22px 25px;
      border: 1px solid var(--line); border-radius: 26px; background: var(--panel);
      box-shadow: 0 0 32px rgba(0,245,255,.08), 0 0 65px rgba(255,43,214,.06), 0 24px 80px rgba(0,0,0,.45);
    }
    .avatar {
      width: 102px; height: 102px; margin: 0 auto 17px; display: grid; place-items: center;
      border-radius: 50%; border: 2px solid var(--cyan);
      background: #080b12; color: var(--cyan); font-size: 34px; font-weight: 850; letter-spacing: 1px;
      box-shadow: 0 0 18px rgba(0,245,255,.32), inset 0 0 18px rgba(255,43,214,.10);
    }
    h1 { margin: 0; font-size: 30px; letter-spacing: 1px; text-shadow: 0 0 15px rgba(0,245,255,.35); }
    .handle { margin: 6px 0 12px; color: var(--cyan); font-size: 14px; }
    .bio { margin: 0 auto 25px; color: var(--muted); font-size: 14px; line-height: 1.6; }
    .links { display: grid; gap: 12px; }
    .link {
      display: flex; align-items: center; gap: 13px; width: 100%; padding: 14px 16px;
      border: 1px solid rgba(255,255,255,.12); border-radius: 14px; color: var(--text);
      text-decoration: none; background: rgba(255,255,255,.035); text-align: left;
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease, background .18s ease;
    }
    .link:hover, .link:focus-visible {
      outline: none; transform: translateY(-2px); border-color: var(--cyan);
      background: rgba(0,245,255,.055); box-shadow: 0 0 16px rgba(0,245,255,.10);
    }
    .icon {
      width: 36px; height: 36px; display: grid; place-items: center; flex-shrink: 0;
      border-radius: 10px; color: var(--cyan); background: rgba(0,245,255,.08);
      border: 1px solid rgba(0,245,255,.18); font-size: 18px; font-weight: 750;
    }
    .label { flex: 1; font-weight: 650; }
    .arrow { color: var(--pink); font-size: 18px; }
    .footer { margin: 23px 0 0; color: #8d96a8; font-size: 12px; }
    .glow-line { width: 72px; height: 2px; margin: 0 auto 20px; background: linear-gradient(90deg,var(--pink),var(--cyan)); box-shadow: 0 0 12px var(--cyan); }
    @media (prefers-reduced-motion: reduce) { .link { transition: none; } .link:hover { transform: none; } }
  </style>
</head>
<body>
  <main class="card">
    <div class="avatar" aria-label="Ulfan initials">U</div>
    <h1>ULFAN</h1>
    <p class="handle">@ulfan</p>
    <div class="glow-line" aria-hidden="true"></div>
    <p class="bio">Creator | Shayari &amp; Lifestyle</p>

    <nav class="links" aria-label="Ulfan's social media profiles">
      <a class="link" href="https://www.instagram.com/mr_ulffann?srtk=ZWIzNGkzZ2c3YWZv" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true">◎</span><span class="label">Instagram</span><span class="arrow" aria-hidden="true">↗</span>
      </a>
      <a class="link" href="https://youtube.com/@ulfancreator?si=9fG_phzi5dbqG10G" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true">▶</span><span class="label">YouTube</span><span class="arrow" aria-hidden="true">↗</span>
      </a>
      <a class="link" href="https://www.facebook.com/share/1JwC2LstyM/" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true">f</span><span class="label">Facebook</span><span class="arrow" aria-hidden="true">↗</span>
      </a>
    </nav>
    <p class="footer">Thanks for stopping by ✦</p>
  </main>
</body>
</html>
